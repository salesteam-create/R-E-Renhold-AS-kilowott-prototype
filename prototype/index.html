let lang='no';try{lang=localStorage.getItem('re-lang')||'no'}catch(e){}
const t=k=>T[lang][k];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];



/* Language */
function apply(){
  document.documentElement.lang=lang==='no'?'nb':'en';
  $$('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  $$('[data-ta]').forEach(e=>e.setAttribute(e.tagName==='IMG'?'alt':'aria-label',t(e.dataset.ta)));
  $$('[data-tp]').forEach(e=>e.placeholder=t(e.dataset.tp));
  $$('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  setNext();
  if(!$('#chat').hidden||$('#msgs').children.length){$('#msgs').innerHTML='';greet()}
}
$$('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('re-lang',lang)}catch(e){}apply()});

/* Header */
const hdr=$('#hdr'),mbar=$('.mbar'),hero=$('.hero');const onScroll=()=>{hdr.classList.toggle('past',scrollY>hero.offsetHeight-120);mbar.classList.toggle('show',scrollY>hero.offsetHeight-200)};
addEventListener('scroll',onScroll,{passive:true});
$('#burger').onclick=()=>{const o=$('#menu').classList.toggle('open');$('#burger').setAttribute('aria-expanded',o);onScroll()};
$$('#menu a').forEach(a=>a.onclick=()=>{$('#menu').classList.remove('open');$('#burger').setAttribute('aria-expanded','false');onScroll()});

/* Quote form */
const form=$('#qform'),steps=$$('#qform [data-step]'),bars=$$('.prog i');let cur=1;
function setNext(){$('#next').innerHTML='';const s=document.createElement('span');s.textContent=t(cur===3?'send':'next');$('#next').append(s);if(cur<3)$('#next').insertAdjacentHTML('beforeend','<svg class="i"><use href="#i-arrow"/></svg>')}
function show(n){cur=n;steps.forEach(s=>s.hidden=+s.dataset.step!==n);bars.forEach((b,i)=>b.classList.toggle('on',i<Math.min(n,3)));$('#back').hidden=n===1;$('#fnav').hidden=n===4;$('#err').textContent='';setNext()}
const size=$('#size'),out=$('#sizeOut');size.oninput=()=>out.textContent=(+size.value).toLocaleString('nb-NO')+' m²';
form.onsubmit=e=>{e.preventDefault();
  if(cur<3)return show(cur+1);
  const req=$$('[data-step="3"] [required]');req.forEach(i=>i.classList.add('touched'));
  const bad=req.find(i=>!i.checkValidity());if(bad){$('#err').textContent=t('err');bad.focus();return}
  const sel=id=>{const s=$('#'+id);return s.options[s.selectedIndex].textContent};
  const svcKey={"Bedriftsrenhold":"s1","Spesialrenhold":"s2","Boning og oppskuring":"s3"}[form.service.value];
  const rows=[[t('sumS'),t(svcKey)],[t('sumB'),sel('building')+', '+sel('place')],[t('sumZ'),out.textContent],[t('sumF'),t(form.freq.value)],[t('sumC'),$('#name').value+', '+$('#company').value]];
  const sum=$('#sum');sum.textContent='';rows.forEach(([k,v])=>{const d=document.createElement('div'),a=document.createElement('span'),b=document.createElement('b');a.textContent=k;b.textContent=v;d.append(a,b);sum.append(d)});
  show(4)};
$('#back').onclick=()=>show(cur-1);
$('#again').onclick=()=>{form.reset();out.textContent='400 m²';$$('.touched').forEach(i=>i.classList.remove('touched'));show(1)};
function toQuote(svc){if(svc){const r=form.querySelector(`input[name=service][value="${svc}"]`);if(r)r.checked=true}show(1);$('#kontakt').scrollIntoView({behavior:'smooth'})}
$$('[data-service]').forEach(b=>b.onclick=()=>toQuote(b.dataset.service));

/* Chatbot: scripted, no external service */
const msgs=$('#msgs');let mode=null,lead={};
function add(text,who){const d=document.createElement('div');d.className='m '+who;d.textContent=text;msgs.append(d);msgs.scrollTop=msgs.scrollHeight}
function chips(list){const w=document.createElement('div');w.className='chips';list.forEach(([label,fn])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>{w.remove();add(label,'me');fn()};w.append(b)});msgs.append(w);msgs.scrollTop=msgs.scrollHeight}
function say(text,next){const ty=document.createElement('div');ty.className='m bot typing';ty.innerHTML='<i></i><i></i><i></i>';msgs.append(ty);msgs.scrollTop=msgs.scrollHeight;
  setTimeout(()=>{ty.remove();add(text,'bot');next&&next()},550)}
const B=k=>t('bot')[k];
function menu(){const c=B('chips');chips([[c.price,price],[c.svc,svc],[c.area,area],[c.call,call],[c.human,human]])}
function greet(){mode=null;say(B('hi'),menu)}
function after(){say(B('more'),menu)}
function price(){say(B('price'),()=>chips([[B('startQ'),()=>{closeChat();toQuote()}],[B('chips').call,call]]))}
function svc(){say(B('svc'),()=>chips([[t('s1'),()=>{closeChat();toQuote('Bedriftsrenhold')}],[t('s2'),()=>{closeChat();toQuote('Spesialrenhold')}],[t('s3'),()=>{closeChat();toQuote('Boning og oppskuring')}]]))}
function area(){say(B('area'),after)}
function human(){say(B('human'),after)}
function call(){mode='name';lead={};say(B('askName'))}
function route(q){const s=q.toLowerCase();
  if(mode==='name'){lead.n=q.slice(0,40);mode='phone';return say(B('askPhone').replace('{n}',lead.n))}
  if(mode==='phone'){const d=q.replace(/[^0-9]/g,'');if(d.length<8)return say(B('badPhone'));mode=null;return say(B('thanks').replace('{p}',q.slice(0,20)),after)}
  if(/pris|kost|price|cost|tilbud|quote/.test(s))return price();
  if(/tjenest|service|bone|boning|floor|gulv|kontor|office|vask|clean/.test(s))return svc();
  if(/område|omrade|area|haugesund|karm|tysv|bokn|sveio|where|hvor/.test(s))return area();
  if(/ring|call|telefon|phone|kontakt|contact|human|person|e-post|email/.test(s))return human();
  say(B('unknown'),menu)}
$('#chatForm').onsubmit=e=>{e.preventDefault();const v=$('#chatIn').value.trim();if(!v)return;$('#chatIn').value='';$$('.msgs .chips').forEach(c=>c.remove());add(v,'me');route(v)};
function openChat(){$('#chat').hidden=false;$('#chatBtn').setAttribute('aria-expanded','true');$('#chatBtn .dot').hidden=true;if(!msgs.children.length)greet();setTimeout(()=>$('#chatIn').focus(),50)}
function closeChat(){$('#chat').hidden=true;$('#chatBtn').setAttribute('aria-expanded','false')}
$('#chatBtn').onclick=()=>$('#chat').hidden?openChat():closeChat();
$('#chatX').onclick=closeChat;

/* Job application */
const jm=$('#jobModal'),jf=$('#jobForm');let jLast=null;
function jobOpen(){jLast=document.activeElement;jf.reset();jf.hidden=false;$('#jobDone').hidden=true;$('#jErr').textContent='';$$('#jobForm .touched').forEach(i=>i.classList.remove('touched'));jm.hidden=false;document.body.style.overflow='hidden';setTimeout(()=>$('#jName').focus(),30)}
function jobClose(){jm.hidden=true;document.body.style.overflow='';if(jLast)jLast.focus()}
$('#jobOpen').onclick=jobOpen;$('#jobX').onclick=jobClose;$('#jobClose').onclick=jobClose;
jm.addEventListener('click',e=>{if(e.target===jm)jobClose()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!jm.hidden)jobClose()});
jf.onsubmit=e=>{e.preventDefault();const req=$$('#jobForm [required]');req.forEach(i=>i.classList.add('touched'));const bad=req.find(i=>!i.checkValidity());if(bad){$('#jErr').textContent=t('jErr');bad.focus();return}jf.hidden=true;$('#jobDone').hidden=false};

apply();onScroll();
}
