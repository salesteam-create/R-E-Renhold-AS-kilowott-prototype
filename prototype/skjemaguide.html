<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Slik fungerer skjemaet | R&amp;E Renhold</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* VOICE work document for a client: calm, clear, a little warm
   IDEA the page walks through the real quote form, step by step, like a printed product sheet
   PICTURE the three form steps and the confirmation drawn as a row of small screens joined by arrows
   COLOUR the website's own palette: deep plum band, white ground, mint for actions, soft lilac panels
   TYPE Plus Jakarta Sans 800 headings + Inter text
   LAYOUT laptop: plum band with title and the four-screen flow beneath; phone: title, then screens in a 2x2 grid */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#130a19);--ink:light-dark(#1c1124,#f3eef8);--soft:light-dark(#5f5569,#bdb2c8);--line:light-dark(#e8e1ef,#33243f);--panel:light-dark(#f3eef8,#1f1428);--card:light-dark(#ffffff,#1a1121);--plum:#24132f;--plum2:#3a2150;--violet:light-dark(#6b3fa0,#b99ae0);--mint:#8be8c1;--mintd:#1d8a5e}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,Arial,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Plus Jakarta Sans",Inter,Arial,sans-serif;letter-spacing:-.02em;line-height:1.1}
.pad{padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(5vw,16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin-inline:auto}
.top{background:var(--plum);color:#fff;margin-top:calc(-1*env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 48px);padding-bottom:48px}
.top .who{color:var(--mint);font-weight:600;font-size:15px}
.top h1{font-size:clamp(32px,4.6vw,50px);font-weight:800;margin-top:10px;max-width:760px}
.top p.sum{color:rgba(255,255,255,.82);font-size:18px;margin-top:14px;max-width:680px}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:36px}
.scr{background:#fff;color:#1c1124;border-radius:16px;padding:14px;position:relative;display:flex;flex-direction:column;gap:8px;min-height:190px}
.scr:not(:last-child)::after{content:"";position:absolute;right:-15px;top:50%;width:12px;height:12px;border-top:2.5px solid var(--mint);border-right:2.5px solid var(--mint);transform:translateY(-50%) rotate(45deg)}
.bar{display:flex;gap:4px}
.bar i{flex:1;height:4px;border-radius:2px;background:#e8e1ef}
.bar i.on{background:#6b3fa0}
.scr small{font-size:13px;color:#5f5569}
.scr b{font:700 15px "Plus Jakarta Sans",sans-serif}
.opt{border:1.5px solid #e8e1ef;border-radius:8px;padding:5px 8px;font-size:13px}
.opt.sel{border-color:#6b3fa0;background:#f3eef8}
.fld{height:22px;border:1.5px solid #d9d0e2;border-radius:6px;font-size:13px;color:#5f5569;padding:1px 7px}
.sld{height:6px;border-radius:3px;background:linear-gradient(90deg,#6b3fa0 40%,#e8e1ef 40%);margin:6px 0}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pills span{font-size:13px;border:1.5px solid #d9d0e2;border-radius:999px;padding:1px 8px}
.pills span.sel{background:#24132f;color:#fff;border-color:#24132f}
.go{margin-top:auto;align-self:flex-end;background:var(--mint);color:#24132f;font-weight:600;font-size:13px;border-radius:999px;padding:4px 12px}
.ok{width:38px;height:38px;border-radius:50%;background:#e3f8ef;color:#1d8a5e;display:grid;place-items:center;font-weight:800;margin:4px auto 0}
.lbl{color:var(--mint);font-size:14px;font-weight:600;margin-top:12px;text-align:center}
.flowlbl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
main{padding-block:44px 64px}
section{margin-top:44px}
section:first-child{margin-top:0}
h2{font-size:clamp(24px,2.8vw,30px);font-weight:800}
.lead{color:var(--soft);margin-top:8px;max-width:720px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:18px}
.box{background:var(--panel);border-radius:18px;padding:22px}
.box h3{font-size:19px;margin-bottom:8px}
.steps{list-style:none;padding:0;margin-top:18px;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:40px;height:40px;border-radius:50%;background:var(--plum);color:var(--mint);display:grid;place-items:center;font:800 16px "Plus Jakarta Sans",sans-serif}
.steps b{display:block}
.steps span{color:var(--soft)}
.scroll{overflow-x:auto;margin-top:18px;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--panel);font-weight:600}
tr:last-child td{border-bottom:0}
td:first-child{white-space:nowrap;color:var(--soft)}
.term{display:inline-block;background:var(--panel);border-radius:6px;padding:0 6px;font-weight:600}
.ticks{list-style:none;padding:0;display:grid;gap:10px}
.ticks li{position:relative;padding-left:28px}
.ticks li::before{content:"";position:absolute;left:2px;top:6px;width:12px;height:7px;border-left:2.5px solid var(--mintd);border-bottom:2.5px solid var(--mintd);transform:rotate(-45deg)}
.funnel{margin-top:18px;display:grid;gap:8px}
.frow{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:12px;align-items:center;font-size:15px}
.ftrack{height:28px;border-radius:8px;background:var(--panel);overflow:hidden}
.ffill{height:100%;background:var(--violet);border-radius:8px}
.frow b{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.note{margin-top:14px;font-size:14px;color:var(--soft)}
.callout{margin-top:18px;border-left:4px solid var(--mint);background:var(--panel);border-radius:0 14px 14px 0;padding:16px 20px}
.demo{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;margin-top:18px;align-items:start}
.dform{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 14px 36px rgba(36,19,47,.08)}
.dprog{display:flex;gap:6px;margin-bottom:18px}
.dprog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dprog i.on{background:var(--violet)}
.dstep{font-size:14px;color:var(--soft)}
.dform h3{font-size:22px;margin:4px 0 16px}
.dopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dopt input,.dpills input{position:absolute;opacity:0}
.dopt span{display:block;padding:16px 14px;border:1.5px solid var(--line);border-radius:14px;font-weight:600;cursor:pointer;height:100%}
.dopt input:checked+span{border-color:var(--violet);background:var(--panel)}
.dopt input:focus-visible+span,.dpills input:focus-visible+span{outline:3px solid var(--mint)}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.df{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:600}
.df.full{grid-column:1/-1}
.df input:not([type=range]),.df select{font:16px Inter,sans-serif;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.df input.touched:invalid{border-color:#c2412d}
.df input[type=range]{accent-color:#6b3fa0}
.dpills{display:flex;flex-wrap:wrap;gap:8px}
.dpills label{position:relative}
.dpills span{display:block;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;font-weight:500;cursor:pointer}
.dpills input:checked+span{background:var(--plum);border-color:var(--plum);color:#fff}
.derr{color:#c2412d;font-size:14px;min-height:20px;margin-top:10px}
.dnav{display:flex;justify-content:space-between;gap:10px}
.dbtn{margin-left:auto;font:600 16px Inter,sans-serif;border:0;border-radius:999px;padding:12px 24px;background:var(--mint);color:#24132f;cursor:pointer}
.dbtn.ghost{margin-left:0;background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.ddone{text-align:center}
.dok{width:56px;height:56px;border-radius:50%;background:#e3f8ef;color:#1d8a5e;display:grid;place-items:center;font-size:26px;font-weight:800;margin:0 auto 12px}
.ddone p{color:var(--soft)}
.dsum{text-align:left;background:var(--panel);border-radius:14px;padding:14px 16px;margin-top:14px;display:grid;gap:6px;font-size:15px}
.dsum div{display:flex;justify-content:space-between;gap:12px}
.dsum span{color:var(--soft)}
.dside{background:var(--plum);color:#fff;border-radius:22px;padding:22px;position:sticky;top:16px}
.dside b{color:var(--mint);font-family:"Plus Jakarta Sans",sans-serif}
.dside p{margin-top:8px;color:rgba(255,255,255,.88)}
footer{border-top:1px solid var(--line);padding-block:22px;color:var(--soft);font-size:14px}
@media(max-width:820px){
.flow,.flowlbl{grid-template-columns:repeat(2,minmax(0,1fr))}
.scr:nth-child(2)::after{display:none}
.flowlbl{display:none}
.two{grid-template-columns:minmax(0,1fr)}
.demo{grid-template-columns:minmax(0,1fr)}
.dside{position:static}
}
@media(max-width:480px){
.frow{grid-template-columns:100px minmax(0,1fr) 52px;font-size:14px}
.scr{min-height:170px}
.dopts,.dgrid{grid-template-columns:minmax(0,1fr)}
}
.tbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.lang{display:flex;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:#fff;font:600 13px Inter,sans-serif;padding:6px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--mint);color:#24132f}
</style>
</head>
<body>


<header class="top pad">
  <div class="wrap">
    <p style="margin-bottom:18px"><a href="index.html#kontakt" style="color:var(--mint);font-weight:600;text-decoration:none;font-size:15px">← Tilbake til nettsiden</a></p>
    <div class="tbar"><p class="who" data-t="who"></p><div class="lang" role="group" aria-label="Språk / Language"><button type="button" data-lang="no" aria-pressed="true">NO</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div></div>
    <h1 data-t="h1"></h1>
    <p class="sum"><span data-t="sum"></span> <a href="#try" style="color:var(--mint);font-weight:600" data-t="tryLink"></a></p>
    <div class="flow" aria-hidden="true">
      <div class="scr">
        <div class="bar"><i class="on"></i><i></i><i></i></div>
        <small data-t="st1"></small><b data-t="f1"></b>
        <div class="opt sel" data-t="o1"></div><div class="opt" data-t="o2"></div><div class="opt" data-t="o3"></div>
        <span class="go" data-t="next"></span>
      </div>
      <div class="scr">
        <div class="bar"><i class="on"></i><i class="on"></i><i></i></div>
        <small data-t="st2"></small><b data-t="f2"></b>
        <div class="fld" data-t="miniBld"></div>
        <div class="sld"></div>
        <div class="pills"><span data-t="q1"></span><span class="sel" data-t="q2"></span><span data-t="q4"></span></div>
        <span class="go" data-t="next"></span>
      </div>
      <div class="scr">
        <div class="bar"><i class="on"></i><i class="on"></i><i class="on"></i></div>
        <small data-t="st3"></small><b data-t="f3"></b>
        <div class="fld" data-t="lbCo"></div><div class="fld" data-t="lbName"></div><div class="fld" data-t="miniContact"></div>
        <span class="go" data-t="send"></span>
      </div>
      <div class="scr">
        <div class="ok">✓</div>
        <b style="text-align:center" data-t="thanks"></b>
        <small style="text-align:center" data-t="soon"></small>
        <div class="opt" data-t="miniSum"></div>
      </div>
    </div>
    <div class="flowlbl" aria-hidden="true"><p class="lbl" data-t="l1"></p><p class="lbl" data-t="l2"></p><p class="lbl" data-t="l3"></p><p class="lbl" data-t="l4"></p></div>
  </div>
</header>

<main class="pad">
  <div class="wrap">
    <section id="try">
      <h2 data-t="tryH"></h2>
      <p class="lead" data-t="tryLead"></p>
      <div class="demo">
        <form class="dform" id="dform" novalidate>
          <div class="dprog" aria-hidden="true"><i class="on"></i><i></i><i></i></div>
          <div data-step="1">
            <p class="dstep" data-t="st1"></p>
            <h3 data-t="f1"></h3>
            <div class="dopts">
              <label class="dopt"><input type="radio" name="svc" value="o1" checked><span data-t="o1"></span></label>
              <label class="dopt"><input type="radio" name="svc" value="o2"><span data-t="o2"></span></label>
              <label class="dopt"><input type="radio" name="svc" value="o3"><span data-t="o3"></span></label>
            </div>
          </div>
          <div data-step="2" hidden>
            <p class="dstep" data-t="st2"></p>
            <h3 data-t="f2"></h3>
            <div class="dgrid">
              <label class="df"><span data-t="lbBld"></span><select id="dbld"><option value="b1" data-t="b1"></option><option value="b2" data-t="b2"></option><option value="b3" data-t="b3"></option><option value="b4" data-t="b4"></option><option value="b5" data-t="b5"></option></select></label>
              <label class="df"><span data-t="lbLoc"></span><select id="dloc"><option>Haugesund</option><option>Karmøy</option><option>Tysvær</option><option>Bokn</option><option>Sveio</option></select></label>
              <label class="df full"><span><span data-t="lbSize"></span> <b id="dsizeout">400 m²</b></span><input type="range" id="dsize" min="50" max="3000" step="50" value="400"></label>
              <div class="df full"><span data-t="lbFreq"></span>
                <div class="dpills">
                  <label><input type="radio" name="freq" value="q1"><span data-t="q1"></span></label>
                  <label><input type="radio" name="freq" value="q2" checked><span data-t="q2"></span></label>
                  <label><input type="radio" name="freq" value="q3"><span data-t="q3"></span></label>
                  <label><input type="radio" name="freq" value="q4"><span data-t="q4"></span></label>
                </div>
              </div>
            </div>
          </div>
          <div data-step="3" hidden>
            <p class="dstep" data-t="st3"></p>
            <h3 data-t="f3"></h3>
            <div class="dgrid">
              <label class="df"><span data-t="lbCo"></span><input id="dco" required></label>
              <label class="df"><span data-t="lbName"></span><input id="dname" required></label>
              <label class="df"><span data-t="lbPhone"></span><input id="dphone" type="tel" required pattern="[0-9 +]{8,}"></label>
              <label class="df"><span data-t="lbEmail"></span><input id="demail" type="email" required></label>
            </div>
          </div>
          <div data-step="4" hidden class="ddone">
            <div class="dok">✓</div>
            <h3 data-t="doneH"></h3>
            <p data-t="doneP"></p>
            <div class="dsum" id="dsum"></div>
            <button type="button" class="dbtn ghost" id="dagain" style="margin-top:14px" data-t="again"></button>
          </div>
          <p class="derr" id="derr" role="alert"></p>
          <div class="dnav">
            <button type="button" class="dbtn ghost" id="dback" hidden data-t="back"></button>
            <button type="submit" class="dbtn" id="dnext"></button>
          </div>
        </form>
        <aside class="dside">
          <b data-t="sideH"></b>
          <p id="dexplain"></p>
        </aside>
      </div>
    </section>

    <section>
      <h2 data-t="forH"></h2>
      <p class="lead" data-h="forP"></p>
      <div class="callout" data-h="good"></div>
    </section>

    <section>
      <h2 data-t="howH"></h2>
      <ol class="steps">
        <li><div><b data-t="h1b"></b><span data-t="h1s"></span></div></li>
        <li><div><b data-t="h2b"></b><span data-t="h2s"></span></div></li>
        <li><div><b data-t="h3b"></b><span data-t="h3s"></span></div></li>
        <li><div><b data-t="h4b"></b><span data-t="h4s"></span></div></li>
      </ol>
      <p class="note" data-t="howNote"></p>
    </section>

    <section>
      <h2 data-t="inH"></h2>
      <div class="scroll">
        <table>
          <thead><tr><th data-t="thStep"></th><th data-t="thInfo"></th><th data-t="thWhy"></th></tr></thead>
          <tbody id="itable"></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2 data-t="benH"></h2>
      <div class="two">
        <div class="box"><h3 data-t="custH"></h3><ul class="ticks" id="cust"></ul></div>
        <div class="box"><h3 data-t="bizH"></h3><ul class="ticks" id="biz"></ul></div>
      </div>
    </section>

    <section>
      <h2 data-t="convH"></h2>
      <p class="lead" data-h="convP"></p>
      <div class="funnel" role="img" data-ta="funnelAlt">
        <div class="frow"><span data-t="fr1"></span><div class="ftrack"><div class="ffill" style="width:100%"></div></div><b>1 000</b></div>
        <div class="frow"><span data-t="fr2"></span><div class="ftrack"><div class="ffill" style="width:30%"></div></div><b>300</b></div>
        <div class="frow"><span data-t="fr3"></span><div class="ftrack"><div class="ffill" style="width:2%;min-width:6px;background:var(--mintd)"></div></div><b>20</b></div>
      </div>
      <p class="note" data-t="convNote"></p>
    </section>

    <section>
      <h2 data-t="nextH"></h2>
      <p class="lead" data-t="nextP"></p>
    </section>
  </div>
</main>

<footer class="pad"><div class="wrap" data-t="foot"></div></footer>

<script>
{
const T={

let lang='no';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const f=$('#dform'),steps=[...f.querySelectorAll('[data-step]')],bars=[...f.querySelectorAll('.dprog i')];
const back=$('#dback'),next=$('#dnext'),err=$('#derr'),size=$('#dsize'),out=$('#dsizeout');
let cur=1;
const fmt=n=>n.toLocaleString(lang==='no'?'nb-NO':'en-GB')+' m²';
function list(id,items){const el=$(id);el.textContent='';items.forEach(([b,t])=>{const li=document.createElement('li'),bb=document.createElement('b'),sp=document.createElement('span');bb.textContent=b+' ';sp.innerHTML=t;li.append(bb,sp);el.append(li)})}
function show(n){cur=n;steps.forEach(s=>s.hidden=+s.dataset.step!==n);bars.forEach((b,i)=>b.classList.toggle('on',i<Math.min(n,3)));back.hidden=n===1||n===4;next.hidden=n===4;next.textContent=T[lang][n===3?'send':'next'];err.textContent='';$('#dexplain').textContent=T[lang].ex[n-1]}
function apply(){
  const L=T[lang];document.documentElement.lang=lang==='no'?'nb':'en';
  $$('[data-t]').forEach(e=>e.textContent=L[e.dataset.t]);
  $$('[data-h]').forEach(e=>e.innerHTML=L[e.dataset.h]);
  $$('[data-ta]').forEach(e=>e.setAttribute('aria-label',L[e.dataset.ta]));
  $$('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  const tb=$('#itable');tb.textContent='';L.rows.forEach(r=>{const tr=document.createElement('tr');r.forEach(c=>{const td=document.createElement('td');td.textContent=c;tr.append(td)});tb.append(tr)});
  list('#cust',L.cust);list('#biz',L.biz);
  out.textContent=fmt(+size.value);
  if(cur===4)render();show(cur);
}
function render(){const L=T[lang],v=id=>document.getElementById(id);const sel=s=>s.options[s.selectedIndex].textContent;
  const rows=[[L.sumS,L[f.svc.value]],[L.sumB,sel(v('dbld'))+', '+v('dloc').value],[L.sumZ,out.textContent],[L.sumF,L[f.freq.value]],[L.sumC,v('dname').value+', '+v('dco').value]];
  const sum=$('#dsum');sum.textContent='';rows.forEach(([k,val])=>{const d=document.createElement('div'),a=document.createElement('span'),b=document.createElement('b');a.textContent=k;b.textContent=val;d.append(a,b);sum.append(d)})}
size.addEventListener('input',()=>{out.textContent=fmt(+size.value)});
f.addEventListener('submit',e=>{e.preventDefault();
  if(cur<3)return show(cur+1);
  const req=[...steps[2].querySelectorAll('[required]')];req.forEach(i=>i.classList.add('touched'));
  const bad=req.find(i=>!i.checkValidity());if(bad){err.textContent=T[lang].err;bad.focus();return}
  render();show(4)});
back.addEventListener('click',()=>show(cur-1));
$('#dagain').addEventListener('click',()=>{f.reset();$$('#dform .touched').forEach(i=>i.classList.remove('touched'));out.textContent=fmt(400);show(1)});
$$('.lang button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;apply()}));
apply();
}
</script>
